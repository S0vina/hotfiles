[main]
icon-theme=Papirus-Dark

horizontal-pad=40
vertical-pad=8
inner-pad=0

scaling-filter=box
image-size-ratio=0.5

gamma-correct-blending=yes
line-height=<use font metrics>
letter-spacing=0

layer=overlay
keyboard-focus=exclusive
exit-on-keyboard-focus-loss=yes

enable-mouse=yes

placeholder=Select your caracter...

[colors]
background=1a1a22ee
text=cdd6f4ff
prompt=bac2deff
placeholder=7f849cff
input=cdd6f4ff
match=cc1414ff
selection=585b70ff
selection-text=cdd6f4ff
selection-match=f2cdcdff
counter=7f849cff
border=bb1414ff

[border]
width=2
radius=0

[dmenu]
mode=text  # text|index
exit-immediately-if-empty=no

[key-bindings]

